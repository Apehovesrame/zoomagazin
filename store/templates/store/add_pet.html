{% extends 'store/base.html' %}
{% block title %}Добавить питомца{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0">🐾 Расскажите о своем питомце</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'store:profile' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-success">Сохранить питомца</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
