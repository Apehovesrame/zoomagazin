{% extends 'store/base.html' %}

{% block title %}Письмо отправлено - Зоомагазин{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="alert alert-success shadow-sm mt-4">
            <h4 class="alert-heading">Письмо отправлено!</h4>
            <hr>
            <p class="mb-0">Мы отправили инструкции по сбросу пароля на ваш email. Пожалуйста, проверьте почту (и папку "Спам", на всякий случай).</p>
        </div>
        <a href="{% url 'store:login' %}" class="btn btn-outline-primary mt-3">Вернуться ко входу</a>
    </div>
</div>
{% endblock %}
