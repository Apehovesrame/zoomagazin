{% extends 'store/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Вход в систему</h2>
        <div class="card shadow-sm"><div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100 mt-3">Войти</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'store:password_reset' %}">Забыли пароль?</a> | 
                <a href="{% url 'store:register' %}">Создать аккаунт</a>
            </div>
        </div></div>
    </div>
</div>
{% endblock %}
