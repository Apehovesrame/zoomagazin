{% extends 'store/base.html' %}
{% block title %}Удаление товара{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">⚠️ Подтверждение удаления</h4>
            </div>
            <div class="card-body text-center p-4">
                <p class="fs-5 mb-4">Вы уверены, что хотите удалить товар <strong>«{{ product.name }}»</strong>?</p>
                <p class="text-muted small">Это действие невозможно отменить.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a href="{% url 'store:manager_dashboard' %}" class="btn btn-outline-secondary px-4">Отмена</a>
                        <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
