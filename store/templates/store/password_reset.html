{% extends 'store/base.html' %}

{% block title %}Восстановление пароля - Зоомагазин{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-3">Сброс пароля</h2>
        <p class="text-muted">Введите email, указанный при регистрации, и мы отправим вам ссылку для восстановления.</p>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Отправить ссылку</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
