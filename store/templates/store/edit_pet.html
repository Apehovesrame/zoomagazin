{% extends 'store/base.html' %}

{% block title %}Редактирование {{ pet.name }} - Зоомагазин{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold">✏️ Редактировать профиль: {{ pet.name }}</h5>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4 text-center">
                        <label class="d-block fw-bold text-muted small text-uppercase mb-2">Текущее фото питомца</label>
                        {% if pet.image %}
                            <img src="{{ pet.image.url }}" class="rounded shadow-sm border p-1" style="max-width: 180px; max-height: 180px; object-fit: cover;">
                        {% else %}
                            <div class="bg-light mx-auto rounded-circle d-flex align-items-center justify-content-center text-muted border" style="width: 120px; height: 120px; font-size: 2.5rem;">
                                🐾
                            </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Добавить еще фото в галерею:</label>
                        <input type="file" name="images_input" multiple class="form-control form-control-sm">
                    </div>

                    <div class="d-flex justify-content-between mt-4 border-top pt-3">
                        <a href="{% url 'store:profile' %}" class="btn btn-outline-secondary px-4">Отмена</a>
                        <button type="submit" class="btn btn-success px-4 fw-bold">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<datalist id="breed-options"></datalist>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Django по умолчанию дает полям формы ID формата "id_имяполя"
    const speciesField = document.getElementById('id_species');
    const breedField = document.getElementById('id_breed');

    if (!speciesField || !breedField) return;

    // Словарь популярных пород (можешь добавлять сюда любые свои варианты)
    const breedsData = {
        'Собака': [
            'Корги', 'Лабрадор-ретривер', 'Немецкая овчарка', 'Золотистый ретривер',
            'Французский бульдог', 'Бульдог', 'Бигль', 'Пудель', 'Ротвейлер',
            'Йоркширский терьер', 'Такса', 'Боксер', 'Сибирский хаски', 'Шпиц',
            'Мопс', 'Доберман', 'Чихуахуа', 'Кокер-спаниель', 'Дворняжка'
        ],
        'Кошка': [
            'Мейн-кун', 'Британская короткошерстная', 'Шотландская вислоухая',
            'Сфинкс', 'Бенгальская', 'Сиамская', 'Персидская', 'Русская голубая',
            'Рэгдолл', 'Абиссинская', 'Сибирская', 'Ориентальная', 'Беспородная'
        ],
        'Птица': [
            'Волнистый попугай', 'Корелла', 'Канарейка', 'Неразлучник', 'Жако', 'Ара', 'Какаду'
        ],
        'Грызун': [
            'Сирийский хомяк', 'Джунгарский хомяк', 'Морская свинка', 'Декоративная крыса',
            'Шиншилла', 'Дегу', 'Песчанка'
        ]
    };

    // Привязываем datalist к полю породы
    breedField.setAttribute('list', 'breed-options');
    breedField.setAttribute('autocomplete', 'off'); // Отключаем стандартные подсказки браузера

    // Функция обновления списка пород
    function updateDatalist() {
        const selectedSpecies = speciesField.value;
        const datalist = document.getElementById('breed-options');
        datalist.innerHTML = ''; // Очищаем старые варианты

        if (breedsData[selectedSpecies]) {
            breedsData[selectedSpecies].forEach(breed => {
                const option = document.createElement('option');
                option.value = breed;
                datalist.appendChild(option);
            });
        }
    }

    // Запускаем при загрузке (полезно при редактировании)
    updateDatalist();

    // Запускаем каждый раз, когда пользователь меняет вид животного
    speciesField.addEventListener('change', function() {
        updateDatalist();
        breedField.value = ''; // Очищаем поле породы при смене вида, чтобы избежать ошибок
    });
});
</script>

{% endblock %}
