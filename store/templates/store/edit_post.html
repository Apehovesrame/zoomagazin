{% extends 'store/base.html' %}
{% block title %}Редактирование поста{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white pt-3">
                <h4 class="mb-0">✏️ Редактирование записи</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">Текст поста</label>
                        {{ form.text }} </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Текущие фотографии:</label>
                        <div class="row g-2 mb-2">
                            {% for img in post.images.all %}
                                <div class="col-3 position-relative">
                                    <img src="{{ img.image.url }}" class="img-thumbnail w-100" style="height: 100px; object-fit: cover;">
                                    </div>
                            {% empty %}
                                <p class="text-muted small">У этого поста пока нет фото.</p>
                            {% endfor %}
                        </div>

                        <label class="form-label fw-bold mt-3">Добавить еще фото (можно несколько):</label>
                        <input type="file" name="images_input" multiple class="form-control">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'store:community' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-primary px-4">Сохранить изменения</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
